# ═════════════════════════════════════════════════════════════════════════════
# graph-data.yaml
# Personal knowledge graph — all content for Graph Site.html
#
# This file is the single source of truth for everything visible on the graph.
# Edit it to add, remove, or update nodes and connections. The site loads and
# parses this file at runtime (via js-yaml); just save and refresh the browser.
# The site must be served over HTTP (e.g. `python3 -m http.server 8080`) —
# opening the HTML file directly won't work because fetch() is blocked on file://.
#
# ─────────────────────────────────────────────────────────────────────────────
# GRAPH STRUCTURE
# ─────────────────────────────────────────────────────────────────────────────
#
# The graph has three tiers:
#
#   center  — one node (me). Always visible, always centered.
#   hub     — top-level category nodes (Education, Experience, etc.).
#             Always visible. Listed under the center node's `children`.
#   leaf    — detail nodes within a category (Georgia Tech, Sevalla, etc.).
#             Hidden by default; fade in when their parent hub is hovered.
#             Listed under their parent hub's `children`.
#
# Cross-branch connections (e.g. a project that uses a skill) are defined with
# `connects` on the node that "owns" the relationship. They render as dashed
# lines and don't imply hierarchy.
#
# ─────────────────────────────────────────────────────────────────────────────
# NODE FIELDS
# ─────────────────────────────────────────────────────────────────────────────
#
#   id        Required. Unique key — referenced in `children` and `connects`.
#             No spaces. Lowercase, short, memorable (e.g. "gt", "sevalla").
#
#   label     Required. Text shown on the graph bubble.
#
#   type      Required. One of: center | hub | leaf
#
#   group     Required. Controls the colour grouping of a node.
#             For hubs: set group to their own id (e.g. id: edu, group: edu).
#             For leaves: set group to their parent hub's id (e.g. group: edu).
#             The center node uses group: core.
#
#   children  List of node ids to connect with solid tree links (hierarchy).
#             Use on the center node to list hubs, and on hub nodes to list
#             their leaves. Not used on leaf nodes.
#
#   connects  List of node ids to connect with dashed cross links (association).
#             Use on any node to draw a relationship across branches.
#             Only define a cross link once — it's bidirectional on hover.
#
#   panel     Optional but recommended. Content shown in the side panel when
#             the node is clicked. All panel fields are optional:
#
#     eyebrow   Small label above the title (e.g. "education", "project").
#     title     Main heading.
#     subtitle  Secondary line beneath the title.
#     meta      List of small chip tags — good for dates, locations, status.
#               Example: ["Atlanta, GA", "Jun 2025 – Present"]
#     body      A paragraph of prose. Use the YAML block scalar (>) for long
#               text to avoid quoting issues — see existing nodes for examples.
#     bullets   List of bullet-point strings. Rendered as a bulleted list.
#     tags      List of short hashtag-style strings shown at the bottom.
#     links     List of clickable links. Each item needs:
#                 label: display text
#                 href:  URL (use mailto: for email, tel: for phone)
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO ADD A NEW NODE
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. Pick a unique id (e.g. "internship2").
# 2. Add the node entry anywhere under `nodes:`. Set type: leaf and
#    group to its parent hub's id.
# 3. Add that id to its parent hub's `children` list.
# 4. Optionally add a `connects` list to link it to nodes in other branches.
# 5. Save and refresh.
#
# To add a new top-level category, set type: hub, group to its own id,
# and add its id to the center node's `children` list.
#
# ═════════════════════════════════════════════════════════════════════════════

