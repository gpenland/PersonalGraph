    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      :root {
        --font: "Hanken Grotesk", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }

      .app {
        position: fixed;
        inset: 0;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        transition: background 0.4s ease, color 0.4s ease;
      }

      /* ── themes ── */
      .theme-dark {
        --bg: oklch(0.17 0.006 60);
        --bg2: oklch(0.115 0.006 60);
        --text: oklch(0.93 0.01 75);
        --muted: oklch(0.62 0.012 70);
        --line: oklch(0.34 0.012 60);
        --panel-bg: oklch(0.205 0.007 60 / 0.86);
        --panel-solid: oklch(0.205 0.007 60);
        --chip-bg: oklch(0.255 0.009 60);
        --chip-bd: oklch(0.34 0.012 60);
        --label-shadow: 0 1px 4px rgb(0 0 0 / 0.55);
      }
      .theme-light {
        --bg: oklch(0.965 0.006 85);
        --bg2: oklch(0.9 0.01 85);
        --text: oklch(0.27 0.012 60);
        --muted: oklch(0.5 0.012 60);
        --line: oklch(0.78 0.012 75);
        --panel-bg: oklch(0.995 0.004 85 / 0.9);
        --panel-solid: oklch(0.99 0.004 85);
        --chip-bg: oklch(0.91 0.01 85);
        --chip-bd: oklch(0.82 0.012 80);
        --label-shadow: 0 1px 3px rgb(255 255 255 / 0.7);
      }

      .graph-wrap {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 120% at 50% 42%, var(--bg) 30%, var(--bg2) 100%);
        touch-action: none;
      }
      .graph-svg { display: block; }

      /* ── links ── */
      .link {
        stroke: var(--line);
        stroke-width: 1.1;
        opacity: var(--link-op);
        transition: opacity 0.25s ease, stroke 0.25s ease, stroke-width 0.2s ease;
      }
      .link-cross { stroke-dasharray: 2 5; opacity: calc(var(--link-op) * 0.65); }
      .link-on { stroke-width: 1.8; opacity: 0.95 !important; stroke-dasharray: none; }
      .link-dim { opacity: calc(var(--link-op) * 0.1) !important; }

      /* ── nodes ── */
      .node-dot {
        transition: r 0.16s cubic-bezier(0.34, 1.4, 0.5, 1), opacity 0.25s ease, filter 0.2s ease;
      }
      .node-g.dim .node-dot { opacity: 0.16; }
      .node-g.dim { transition: opacity 0.25s; }
      .skin-obsidian .node-dot.t-center { filter: drop-shadow(0 0 11px var(--glow)); }
      .skin-obsidian .node-dot.t-hub { filter: drop-shadow(0 0 7px var(--glow)); }
      .skin-obsidian .node-dot.on { filter: drop-shadow(0 0 15px var(--glow)); }
      .halo, .sel-ring, .node-label { pointer-events: none; }
      .sel-ring { fill: none; stroke-width: 1.5; opacity: 0.7; }

      .node-label {
        fill: var(--text);
        font-family: var(--font);
        text-shadow: var(--label-shadow);
        transition: opacity 0.25s ease;
      }
      .l-center { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
      .l-hub { font-size: 13px; font-weight: 560; }
      .l-leaf { font-size: 11.5px; font-weight: 480; }

      /* ── top bar ── */
      .topbar {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        z-index: 20;
        pointer-events: none;
      }
      .brand { display: flex; align-items: center; gap: 9px; pointer-events: auto; }
      .brand-glyph line { stroke: var(--muted); stroke-width: 1.3; }
      .brand-glyph circle { fill: var(--muted); }
      .brand-glyph .bg-c { fill: var(--accent); }
      .brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
      .brand-name .dim { color: var(--muted); font-weight: 500; }

      .seg {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--chip-bd);
        background: var(--panel-bg);
        backdrop-filter: blur(10px);
        border-radius: 999px;
        pointer-events: auto;
      }
      .seg-label {
        font-family: var(--mono);
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        padding: 0 6px 0 8px;
      }
      .seg-btn {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        background: transparent;
        border: 0;
        padding: 5px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition: color 0.2s, background 0.2s;
      }
      .seg-btn:hover { color: var(--text); }
      .seg-btn.on {
        color: var(--bg);
        background: var(--accent);
        font-weight: 500;
      }
      .theme-light .seg-btn.on { color: #fff; }

      /* ── status bar ── */
      .statusbar {
        position: absolute;
        left: 22px;
        bottom: 16px;
        z-index: 20;
        display: flex;
        gap: 8px;
        align-items: center;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
      }
      .statusbar .sep { opacity: 0.5; }

      /* ── side panel ── */
      .panel {
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 384px;
        max-width: 92vw;
        background: var(--panel-bg);
        backdrop-filter: blur(16px);
        border-left: 1px solid var(--line);
        transform: translate(101%, 0);
        transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 30;
        overflow: hidden;
      }
      .panel.open { box-shadow: -24px 0 60px -30px rgb(0 0 0 / 0.6); }
      .panel-inner {
        height: 100%;
        overflow-y: auto;
        padding: 30px 30px 48px;
        animation: fadeUp 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .panel-close {
        position: absolute;
        top: 18px; right: 18px;
        width: 30px; height: 30px;
        border-radius: 50%;
        border: 1px solid var(--chip-bd);
        background: var(--chip-bg);
        color: var(--muted);
        font-size: 19px;
        line-height: 1;
        cursor: pointer;
        transition: color 0.2s, border-color 0.2s;
      }
      .panel-close:hover { color: var(--text); border-color: var(--muted); }
      .panel-eyebrow {
        font-family: var(--mono);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        margin-bottom: 10px;
      }
      .panel-title {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.12;
        margin: 0 0 6px;
        text-wrap: pretty;
        padding-right: 26px;
      }
      .panel-sub { font-size: 14px; color: var(--muted); font-weight: 500; line-height: 1.4; }
      .panel-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
      .meta-chip {
        font-family: var(--mono);
        font-size: 11px;
        white-space: nowrap;
        color: var(--muted);
        background: var(--chip-bg);
        border: 1px solid var(--chip-bd);
        padding: 3px 9px;
        border-radius: 6px;
      }
      .panel-body {
        font-size: 14.5px;
        line-height: 1.62;
        color: var(--text);
        margin: 18px 0 0;
        text-wrap: pretty;
      }
      .panel-bullets {
        margin: 14px 0 0;
        padding-left: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel-bullets li {
        position: relative;
        padding-left: 18px;
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--text);
        text-wrap: pretty;
      }
      .panel-bullets li::before {
        content: "";
        position: absolute;
        left: 2px; top: 8px;
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--accent);
      }
      .panel-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 20px; }
      .tag {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--muted);
        background: var(--chip-bg);
        padding: 4px 10px;
        border-radius: 999px;
      }
      .panel-links { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
      .panel-link {
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
      }
      .panel-link .arr { font-size: 12px; opacity: 0.7; }
      .panel-link:hover { text-decoration: underline; }

      .linked { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 20px; }
      .linked-head {
        font-family: var(--mono);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .linked-list { display: flex; flex-wrap: wrap; gap: 8px; }
      .linked-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        font-family: var(--font);
        font-size: 13px;
        color: var(--text);
        background: var(--chip-bg);
        border: 1px solid var(--chip-bd);
        padding: 6px 12px 6px 10px;
        border-radius: 999px;
        cursor: pointer;
        transition: border-color 0.2s, transform 0.15s;
      }
      .linked-chip:hover { border-color: var(--muted); transform: translateY(-1px); }
      .linked-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

      @media (max-width: 720px) {
        .panel {
          top: auto; left: 0; right: 0; bottom: 0;
          width: 100%; max-width: 100%;
          height: 68vh;
          border-left: 0;
          border-top: 1px solid var(--line);
          border-radius: 18px 18px 0 0;
          transform: translate(0, 101%);
        }
        .panel.open { box-shadow: 0 -24px 60px -30px rgb(0 0 0 / 0.6); }
        .panel-inner { padding: 26px 22px 40px; }
        .topbar { padding: 14px 16px; }
        .statusbar { left: 16px; bottom: 12px; }
        .brand-name { font-size: 13px; }
      }
    </style>

          restHub: 180,
          restTree: 100,
          restCross: 180,
          gravity: 0.02,
          damping: 0.86,
          drift: 1,
          maxV: 18,
        },
        opts || {}
      );
      this.w = 1000;
      this.h = 700;
      this.dragId = null;
      this.dragPos = null;
      this._build();
    }

    _build() {
      const { nodes } = this.data;
      const cx = this.w / 2;
      const cy = this.h / 2;

      const parent = {};
      this.data.links.forEach(([a, b, t]) => {
        if (t === "tree" && parent[b] === undefined) parent[b] = a;
      });
      const hubs = nodes.filter((n) => n.type === "hub");
      const hubAngle = {};
      hubs.forEach((h, i) => {
        hubAngle[h.id] = (i / hubs.length) * Math.PI * 2 - Math.PI / 2;
      });
      const sibCount = {};
      nodes.forEach((n) => {
        if (n.type === "leaf") {
          const p = parent[n.id];
          sibCount[p] = (sibCount[p] || 0) + 1;
        }
      });
      const seen = {};

      this.nodes = nodes.map((n) => {
        const isCenter = n.type === "center";
        let x = cx, y = cy;
        if (n.type === "hub") {
          const a = hubAngle[n.id];
          x = cx + Math.cos(a) * 185;
          y = cy + Math.sin(a) * 185;
        } else if (n.type === "leaf") {
          const p = parent[n.id];
          const base = hubAngle[p] != null ? hubAngle[p] : rand(0, Math.PI * 2);
          seen[p] = (seen[p] || 0);
          const k = seen[p]++;
          const n2 = sibCount[p] || 1;
          const spread = (k - (n2 - 1) / 2) * 0.5;
          const a = base + spread;
          x = cx + Math.cos(a) * 310 + rand(-10, 10);
          y = cy + Math.sin(a) * 310 + rand(-10, 10);
        }
        return {
          ref: n,
          id: n.id,
          x, y,
          vx: 0, vy: 0,
          mass: isCenter ? 7 : n.type === "hub" ? 2.4 : 1,
          isCenter,
          phase: rand(0, Math.PI * 2),
          freq: rand(0.4, 0.9),
        };
      });
      this.index = {};
      this.nodes.forEach((n) => (this.index[n.id] = n));
      this.t = 0;
    }

    setBounds(w, h) {
      const ocx = this.w / 2, ocy = this.h / 2;
      this.w = w; this.h = h;
      const dx = w / 2 - ocx, dy = h / 2 - ocy;
      this.nodes.forEach((n) => { n.x += dx; n.y += dy; });
    }

    grab(id) {
      this.dragId = id;
      const n = this.index[id];
      this.dragPos = { x: n.x, y: n.y };
    }
    dragTo(x, y) {
      if (this.dragPos) this.dragPos = { x, y };
    }
    release() {
      this.dragId = null;
      this.dragPos = null;
    }

    setParam(k, v) {
      this.opts[k] = v;
    }

    tick(dt) {
      const o = this.opts;
      const cx = this.w / 2;
      const cy = this.h / 2;
      const N = this.nodes;
      this.t += dt;

      for (const n of N) { n.fx = 0; n.fy = 0; }

      for (let i = 0; i < N.length; i++) {
        const a = N[i];
        for (let j = i + 1; j < N.length; j++) {
          const b = N[j];
          let dx = a.x - b.x;
          let dy = a.y - b.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 1) { d2 = 1; dx = rand(-1, 1); dy = rand(-1, 1); }
          const d = Math.sqrt(d2);
          const f = o.repulsion / d2;
          const ux = dx / d, uy = dy / d;
          a.fx += ux * f; a.fy += uy * f;
          b.fx -= ux * f; b.fy -= uy * f;
        }
      }

      for (const [s, t, type] of this.data.links) {
        const a = this.index[s];
        const b = this.index[t];
        if (!a || !b) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const toCenter = a.isCenter || b.isCenter;
        const rest = type === "cross" ? o.restCross : toCenter ? o.restHub : o.restTree;
        const k = type === "cross" ? o.springCross : o.springTree;
        const f = (d - rest) * k;
        const ux = dx / d, uy = dy / d;
        a.fx += ux * f; a.fy += uy * f;
        b.fx -= ux * f; b.fy -= uy * f;
      }

      for (const n of N) {
        n.fx += (cx - n.x) * o.gravity * (n.isCenter ? 6 : 1);
        n.fy += (cy - n.y) * o.gravity * (n.isCenter ? 6 : 1);
        if (!n.isCenter && o.drift > 0) {
          n.fx += Math.cos(this.t * n.freq + n.phase) * 0.9 * o.drift;
          n.fy += Math.sin(this.t * n.freq * 1.3 + n.phase) * 0.9 * o.drift;
        }
      }

      for (const n of N) {
        if (n.id === this.dragId && this.dragPos) {
          n.x = this.dragPos.x; n.y = this.dragPos.y;
          n.vx = 0; n.vy = 0;
          continue;
        }
        n.vx = (n.vx + (n.fx / n.mass) * dt) * o.damping;
        n.vy = (n.vy + (n.fy / n.mass) * dt) * o.damping;
        const sp = Math.hypot(n.vx, n.vy);
        if (sp > o.maxV) { n.vx = (n.vx / sp) * o.maxV; n.vy = (n.vy / sp) * o.maxV; }
        n.x += n.vx * dt;
        n.y += n.vy * dt;
        const pad = 70;
        if (n.x < pad) n.vx += (pad - n.x) * 0.04;
        if (n.x > this.w - pad) n.vx -= (n.x - (this.w - pad)) * 0.04;
        if (n.y < pad) n.vy += (pad - n.y) * 0.04;
        if (n.y > this.h - pad) n.vy -= (n.y - (this.h - pad)) * 0.04;
      }
    }
  }

  window.Sim = Sim;
})();

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  const dismiss = () => setOpen(false);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <button
        onClick={() => setOpen(o => !o)}
        style={{
          position: 'fixed', bottom: 16, right: 16, zIndex: 2147483645,
          width: 36, height: 36, border: 0, borderRadius: 10,
          background: 'rgba(255,255,255,0.12)', backdropFilter: 'blur(12px)',
          color: 'rgba(255,255,255,0.7)', fontSize: 16, cursor: 'pointer',
          display: open ? 'none' : 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 2px 8px rgba(0,0,0,0.3)',

          <div className="twk-hd" onMouseDown={onDragStart}>
            <b>{title}</b>
            <button className="twk-x" aria-label="Close tweaks"
                    onMouseDown={(e) => e.stopPropagation()}
                    onClick={dismiss}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      )}
    </>
  );
}

function TweakToggle({ label, value, onChange }) {

    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" style={{ width: 56, height: 22, border: '.5px solid rgba(0,0,0,.1)', borderRadius: 6, padding: 0, cursor: 'default', background: 'transparent' }}
               value={value} onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>{sup.map((c, j) => <i key={j} style={{ background: c }} />)}</span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakColor,
});

      simRef.current.setBounds(width, height);
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  useEffect(() => {
    let raf;
    let last = performance.now();
    const loop = (now) => {
      const dt = Math.min(2, (now - last) / 16.67);
      last = now;
      for (let i = 0; i < 2; i++) simRef.current.tick(dt / 2);
      setTick((t) => (t + 1) % 1000000);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);

  const sim = simRef.current;
  const G = window.GRAPH;

  const active = hovered || selectedId;
  const neighborSet = useMemo(() => {
    if (!active) return null;
    const s = new Set(G.adj[active]);
    s.add(active);
    return s;
  }, [active, G]);

  const pt = (e) => {
    const r = wrapRef.current.getBoundingClientRect();
    const c = e.touches ? e.touches[0] : e;
    return { x: c.clientX - r.left, y: c.clientY - r.top };
  };
  const onDown = (id) => (e) => {
    e.preventDefault();
    const p = pt(e);
    dragState.current = { id, moved: false, sx: p.x, sy: p.y };
    sim.grab(id);
  };
  useEffect(() => {
    const move = (e) => {
      const d = dragState.current;
      if (!d.id) return;
      const p = pt(e);
      if (Math.hypot(p.x - d.sx, p.y - d.sy) > 4) d.moved = true;
      sim.dragTo(p.x, p.y);
    };
    const up = () => {
      const d = dragState.current;
      if (d.id) {
        if (!d.moved) onSelect(d.id === selectedId ? null : d.id);
        sim.release();
      }
      dragState.current = { id: null, moved: false, sx: 0, sy: 0 };
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    return () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
  }, [selectedId, onSelect, sim]);

  const sizeMul = tweaks.nodeSize;

  return (
    <div className="graph-wrap" ref={wrapRef}>
      <svg
        className="graph-svg skin-obsidian"
        width={dims.w}
        height={dims.h}
        viewBox={`0 0 ${dims.w} ${dims.h}`}
        onClick={(e) => { if (e.target.tagName === "svg") onSelect(null); }}
      >

        <g className="links">
          {G.links.map(([s, t, type], i) => {
            const a = sim.index[s];
            const b = sim.index[t];
            if (!a || !b) return null;
            const touch = active && (s === active || t === active);
            const dimmed = active && !touch;
            const isCross = type === "cross";
            return (
              <line
                key={i}
                x1={a.x} y1={a.y} x2={b.x} y2={b.y}
                className={
                  "link" +
                  (isCross ? " link-cross" : "") +
                  (touch ? " link-on" : "") +
                  (dimmed ? " link-dim" : "")
                }
                stroke={touch ? accent : undefined}
              />
            );
          })}
        </g>

        <g className="nodes">
          {sim.nodes.map((n) => {
            const node = n.ref;
            const baseR = radiusFor(node.type) * sizeMul;
            const isHover = hovered === n.id;
            const isSel = selectedId === n.id;
            const grow = isHover || isSel ? 1.34 : 1;
            const r = baseR * grow;
            const inFocus = !active || (neighborSet && neighborSet.has(n.id));
            const dimmed = active && !inFocus;
            const col = colorFor(node, accent);
            const labelOpacity = dimmed
              ? 0.1
              : node.type === "leaf"
              ? isHover || isSel || (neighborSet && neighborSet.has(n.id))
                ? 1
                : tweaks.labels === "hover"
                ? 0
                : 0.42
              : active ? 0.95 : 0.92;
            return (
              <g
                key={n.id}
                transform={`translate(${n.x},${n.y})`}
                className={"node-g" + (dimmed ? " dim" : "")}
                onMouseEnter={() => setHovered(n.id)}
                onMouseLeave={() => setHovered((h) => (h === n.id ? null : h))}
                onPointerDown={onDown(n.id)}
                style={{ cursor: "pointer" }}
              >
                <circle
                  r={r}
                  className={"node-dot t-" + node.type + (isHover || isSel ? " on" : "")}
                  fill={col}
                  style={{ "--glow": col }}
                />
                {isSel && <circle r={r + 6} className="sel-ring" stroke={accent} />}
                <text
                  className={"node-label l-" + node.type}
                  y={baseR * grow + (node.type === "center" ? 22 : 16)}
                  style={{ opacity: labelOpacity }}
                  textAnchor="middle"
                >
                  {node.label}
                </text>
              </g>
            );
          })}
        </g>
      </svg>
    </div>
  );
}

function Panel({ id, onSelect, accent }) {
  const node = useMemo(
    () => (id ? window.GRAPH.nodes.find((n) => n.id === id) : null),
    [id]
  );
  const neighbors = useMemo(() => {
    if (!id) return [];
    return [...window.GRAPH.adj[id]].map((nid) =>
      window.GRAPH.nodes.find((n) => n.id === nid)
    );
  }, [id]);

  const p = node && node.panel;
  return (
    <aside
      className={"panel" + (id ? " open" : "")}
      aria-hidden={!id}
      style={{ transform: id ? "translate(0,0)" : undefined }}
    >
      {node && (
        <div className="panel-inner" key={id}>
          <button className="panel-close" onClick={() => onSelect(null)} aria-label="Close">
            ×
          </button>
          {p.eyebrow && <div className="panel-eyebrow" style={{ color: accent }}>{p.eyebrow}</div>}
          <h2 className="panel-title">{p.title}</h2>
          {p.subtitle && <div className="panel-sub">{p.subtitle}</div>}
          {p.meta && (
            <div className="panel-meta">
              {p.meta.map((m, i) => <span key={i} className="meta-chip">{m}</span>)}
            </div>
          )}
          {p.body && <p className="panel-body">{p.body}</p>}
          {p.bullets && (
            <ul className="panel-bullets">
              {p.bullets.map((b, i) => <li key={i}>{b}</li>)}
            </ul>
          )}
          {p.tags && (
            <div className="panel-tags">
              {p.tags.map((t, i) => (
                <span key={i} className="tag">#{t.toLowerCase().replace(/[^a-z0-9]+/g, "-")}</span>
              ))}
            </div>
          )}
          {p.links && (
            <div className="panel-links">
              {p.links.map((l, i) => (
                <a key={i} href={l.href} target="_blank" rel="noreferrer" className="panel-link" style={{ color: accent }}>
                  {l.label} <span className="arr">↗</span>
                </a>
              ))}
            </div>
          )}
          {neighbors.length > 0 && (
            <div className="linked">
              <div className="linked-head">Linked notes · {neighbors.length}</div>
              <div className="linked-list">
                {neighbors.map((nb) => (
                  <button key={nb.id} className="linked-chip" onClick={() => onSelect(nb.id)}>
                    <span className="dot" style={{ background: colorFor(nb, accent) }} />
                    {nb.label}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </aside>
  );
}

function TopBar() {
  return (
    <header className="topbar">
      <div className="brand">
        <svg width="22" height="22" viewBox="0 0 22 22" className="brand-glyph">
          <line x1="11" y1="11" x2="4" y2="5" />
          <line x1="11" y1="11" x2="18" y2="6" />
          <line x1="11" y1="11" x2="6" y2="17" />
          <circle cx="11" cy="11" r="3.4" className="bg-c" />
          <circle cx="4" cy="5" r="2" />
          <circle cx="18" cy="6" r="2" />
          <circle cx="6" cy="17" r="2" />
        </svg>
        <span className="brand-name">grayson<span className="dim">.penland</span></span>
      </div>
    </header>
  );
}

function StatusBar({ selectedId }) {
  const n = window.GRAPH.nodes.length;
  const l = window.GRAPH.links.length;
  return (
    <footer className="statusbar">
      <span>{n} nodes · {l} links</span>
      <span className="sep">/</span>
      <span>{selectedId ? "viewing: " + selectedId : "drag to rearrange · click a node"}</span>
    </footer>
  );
}

Object.assign(window, { GraphView, Panel, TopBar, StatusBar });
    </script>

    <!-- app.jsx -->
    <script type="text/babel">
const { useState: useStateA } = React;

const TWEAK_DEFAULTS = {
  accent: "#e0823d",
  dark: true,
  floatSpeed: 1,
  linkOpacity: 0.5,
  nodeSize: 1,
  labels: "always",
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [selectedId, setSelectedId] = useStateA(null);

  const rootStyle = {
    "--accent": t.accent,
    "--link-op": t.linkOpacity,
  };

  return (
    <div
      className={"app theme-" + (t.dark ? "dark" : "light") + " skin-obsidian"}
      style={rootStyle}
    >
      <TopBar />
      <GraphView
        accent={t.accent}
        tweaks={t}
        selectedId={selectedId}
        onSelect={setSelectedId}
      />
      <Panel id={selectedId} onSelect={setSelectedId} accent={t.accent} />
      <StatusBar selectedId={selectedId} />

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakColor
          label="Accent"
          value={t.accent}
          options={["#e0823d", "#7c6cf0", "#3ba88f", "#4a9fe0", "#d94f6a"]}
          onChange={(v) => setTweak("accent", v)}
        />
        <TweakToggle label="Dark canvas" value={t.dark} onChange={(v) => setTweak("dark", v)} />

        <TweakSection label="Graph physics" />
        <TweakSlider
          label="Float speed"
          value={t.floatSpeed}
          min={0} max={2.5} step={0.1}
          onChange={(v) => setTweak("floatSpeed", v)}
        />
        <TweakSlider
          label="Node size"
          value={t.nodeSize}
          min={0.7} max={1.5} step={0.05}
          onChange={(v) => setTweak("nodeSize", v)}
        />
        <TweakSlider
          label="Link opacity"
          value={t.linkOpacity}
          min={0.1} max={1} step={0.05}
          onChange={(v) => setTweak("linkOpacity", v)}
        />

        <TweakSection label="Labels" />
        <TweakRadio
          label="Leaf labels"
          value={t.labels}
          options={["always", "hover"]}
          onChange={(v) => setTweak("labels", v)}
        />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
